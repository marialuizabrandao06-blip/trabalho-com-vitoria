<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Etsy | Produtos Artesanais</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <h1>Etsy</h1>

        <nav>
            <a href="#">Início</a>
            <a href="#">Produtos</a>
            <a href="#">Sobre nós</a>
            <a href="#">Contato</a>
        </nav>

    </header>


    <main>

        <section class="inicio">

            <h2>Produtos artesanais e naturais</h2>

            <p>
                Encontre produtos feitos à mão com carinho.
            </p>

            <button>Ver produtos</button>

        </section>


        <section class="produtos">

            <h2>Nossos produtos</h2>

            <div class="lista-produtos">

                <div class="produto">
                    <img src="queijo.jpg" alt="Queijo temperado">
                    <h3>Queijo temperado</h3>
                    <p class="categoria">Iguarias artesanais</p>
                    <p class="preco">R$ 45,00</p>
                    <button>Encomendar</button>
                </div>

                <div class="produto">
                    <img src="geleia.png" alt="Geleia de Amora">
                    <h3>Queijo temperado</h3>
                    <p class="categoria">Iguarias artesanais</p>
                    <p class="preco">R$ 26,00</p>
                    <button>Encomendar</button>
                </div>


            </div>

        </section>

    </main>


    <footer>

        <p>© 2026 Etsy - Produtos artesanais e naturais</p>

    </footer>

</body>

</html>
